name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install all dependencies
        run: pnpm install --ignore-scripts
      - name: Build and test
        run: pnpm test
        env:
          CI: 1
          NO_CONTENT: 1
  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      packages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --production
      - name: Build static files
        run: pnpm build
      - name: Build Docker image
        run: docker build -t ghcr.io/logux/logux.org:latest .
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: docker push ghcr.io/logux/logux.org:latest
      - name: Deploy image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let token = await core.getIDToken('https://api.cloud.hplush.dev')
            let response = await fetch(
              'https://api.cloud.hplush.dev/deploy/logux.org',
              { method: 'POST', headers: { authorization: `Bearer ${token}` } }
            )
            let answer = await response.text()
            if (response.ok) core.info(answer)
            else core.setFailed(`${response.status} ${response.statusText}: ${answer}`)
      - name: Clean previous images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS="orgs/logux/packages/container/logux.org/versions"
          IDS=$(gh api --paginate "$VERSIONS?per_page=100" \
            | jq -r '.[] | select(.metadata.container.tags == []) | .id')
          if [ -n "$IDS" ]; then
            for ID in $IDS; do
              echo "Deleting version $ID"
              gh api -X DELETE "$VERSIONS/$ID" --silent
            done
          else
            echo "No untagged images"
          fi

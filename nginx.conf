worker_processes 1;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
    text/markdown md;
  }
  default_type application/octet-stream;
  charset_types application/javascript text/css application/manifest+json image/svg+xml text/markdown text/plain;
  sendfile on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    application/manifest+json
    application/javascript
    image/svg+xml
    text/css
    text/markdown
    text/plain;

  # `add_header` in a location replaces every inherited one, so the cache
  # policy comes from a variable and all headers stay in a single place.
  map $uri $cache_control {
    default                                "public";
    # Branding files have no hash in the name and can be replaced
    ~^/branding/.+\.svg$                   "public, max-age=86400";
    ~\.(css|js|png|svg|webmanifest|woff2)$ "public, max-age=31536000, immutable";
  }

  # LLMs and AI agents read Markdown far better than our HTML, so the build
  # writes a Markdown copy of every page next to its directory: the page
  # `/guide/core/` is also the file `/guide/core.md`. The maps below wire the
  # two together — where the copy is, how each form advertises the other,
  # and when to answer a page URL with Markdown instead of HTML.

  # Where the Markdown copy of the requested page is. Empty for anything
  # that is not a page: assets have no copy and skip everything below.
  map $uri $markdown_uri {
    default            "";
    "/"                "/index.md";
    "~^(?<page>/.+)/$" "$page.md";
  }

  # The `Link` header of the response, pointing at the other form of the
  # same document: pages advertise their Markdown copy, Markdown files link
  # back to the page. A crawler that found either one can reach the other.
  # It is also the flag for “this URL is one of the two forms”.
  #
  # A page URL is matched as `index.html` because that is what `index` turns
  # it into before the response is sent. Category URLs like `/guide/` never
  # get that far — they redirect — so they advertise nothing, which is right:
  # they have no page and no copy.
  map $uri $alternate {
    default                       "";
    # The UI kit is a design demo built from no Markdown
    "/uikit/index.html"           "";
    "/index.html"                 "</index.md>; rel=\"alternate\"; type=\"text/markdown\"";
    "/index.md"                   "</>; rel=\"alternate\"; type=\"text/html\"";
    "~^(?<dir>/.+)/index\.html$"  "<$dir.md>; rel=\"alternate\"; type=\"text/markdown\"";
    "~^(?<html>/.+)\.md$"         "<$html/>; rel=\"alternate\"; type=\"text/html\"";
  }

  # Page URLs answer with either form depending on `Accept`, so caches have
  # to keep the two apart. Assets have one form and stay cached as before.
  map $alternate $vary {
    default "Accept";
    ""      "";
  }

  # Coding agents ask for pages with `Accept: text/markdown` (RFC 7763), and
  # the three maps below decide what such a request gets. Which form the
  # client prefers is in the q-values, not in the presence of a type:
  # `text/html, text/markdown;q=0.5` asks for HTML.
  #
  # nginx cannot compare numbers, so each type is reduced to one character:
  # `a` when the client wants it most, `0` when it refused it, the first
  # decimal of the q-value in between, and empty when the type was never
  # mentioned. `0` < … < `9` < `a`, so `$representation` compares them as
  # characters.
  map $http_accept $markdown_q {
    default                                              "";
    # An explicit `q=0.N` sets the rank; naming the type alone is the top
    "~*(^|,)\s*text/markdown\s*;\s*q=0\.(?<q>\d)"        $q;
    "~*(^|,)\s*text/markdown\s*(;\s*q=1(\.0+)?)?\s*(,|$)" "a";
  }

  # HTML can be asked for by name or by a wildcard. A named type sets the
  # rank over a wildcard, so `text/html` is matched before `*/*`.
  map $http_accept $html_q {
    default                                                   "";
    # No `Accept` at all means the client takes whatever we send
    ""                                                        "a";
    "~*(^|,)\s*text/html\s*;\s*q=0\.(?<h>\d)"                 $h;
    "~*(^|,)\s*text/html\s*(;\s*q=1(\.0+)?)?\s*(,|$)"         "a";
    "~*(^|,)\s*(text/\*|\*/\*)\s*;\s*q=0\.(?<w>\d)"           $w;
    "~*(^|,)\s*(text/\*|\*/\*)\s*(;\s*q=1(\.0+)?)?\s*(,|$)"   "a";
  }

  # The form to send. Markdown needs a rank at least as high as HTML, so
  # a tie goes to Markdown: agents send `text/markdown, text/html` with both
  # at `q=1` and mean the first one. Only a named `text/markdown` can tie
  # like that — the `*/*` in every browser request leaves Markdown empty,
  # so a browser can never be flipped to it.
  map "$markdown_q:$html_q" $representation {
    default      html;
    # Neither form was asked for
    "~^0?:0?$"   none;
    # Only one of the two was asked for
    "~^0?:"      html;
    "~:0?$"      markdown;
    # Both were: send Markdown unless HTML outranks it
    "~^a"        markdown;
    "~^9:[0-9]$" markdown;
    "~^8:[0-8]$" markdown;
    "~^7:[0-7]$" markdown;
    "~^6:[0-6]$" markdown;
    "~^5:[0-5]$" markdown;
    "~^4:[0-4]$" markdown;
    "~^3:[0-3]$" markdown;
    "~^2:[0-2]$" markdown;
    "~^1:1$"     markdown;
  }

  server {
    listen 8000;

    root /var/www;
    charset UTF-8;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; style-src 'unsafe-inline' 'self'; script-src 'self'";
    add_header Cache-Control $cache_control;
    add_header Link $alternate;
    add_header Vary $vary;

    if ($host ~ ^www\.(?<domain>.+)$) {
      return 301 https://$domain$request_uri;
    }

    if (-d $request_filename) {
      rewrite [^/]$ https://$http_host$uri/ permanent;
    }

    location = /guide/ {
      return 302 https://$http_host/guide/architecture/core/;
    }

    location = /guide/architecture/ {
      return 302 https://$http_host/guide/architecture/core/;
    }

    location = /guide/starting/ {
      return 302 https://$http_host/guide/starting/project/;
    }

    location = /guide/concepts/ {
      return 302 https://$http_host/guide/concepts/node/;
    }

    location = /recipes/ {
      return 302 https://$http_host/recipes/authentication/;
    }

    location = /protocols/ {
      return 302 https://$http_host/protocols/ws/spec/;
    }

    location = /protocols/ws/ {
      return 302 https://$http_host/protocols/ws/spec/;
    }

    # The UI kit is a design demo with no Markdown copy to negotiate
    location = /uikit/ {
    }

    # Pages are directories, so the trailing slash is what marks a URL as
    # having two forms. `/guide/core.md` is a URL of its own and is served
    # as it is: asking for a file by name overrides negotiation.
    location ~ /$ {
      # Keep the page URL, answer it from the Markdown file
      if ($representation = markdown) {
        rewrite ^ $markdown_uri last;
      }
      # Say so instead of quietly sending a form the client refused
      if ($representation = none) {
        return 406;
      }
    }

    # Images and fonts can’t use the policy, so we save the traffic
    location ~* \.(ico|png|woff2)$ {
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Cache-Control $cache_control;
    }
  }
}

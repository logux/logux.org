worker_processes 1;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset_types application/javascript text/css application/manifest+json image/svg+xml;
  sendfile on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    application/manifest+json
    application/javascript
    image/svg+xml
    text/css
    text/plain;

  # `add_header` in a location replaces every inherited one, so the cache
  # policy comes from a variable and all headers stay in a single place.
  map $uri $cache_control {
    default                                "public";
    # Branding files have no hash in the name and can be replaced
    ~^/branding/.+\.svg$                   "public, max-age=86400";
    ~\.(css|js|png|svg|webmanifest|woff2)$ "public, max-age=31536000, immutable";
  }

  server {
    listen 8000;

    root /var/www;
    charset UTF-8;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; style-src 'unsafe-inline' 'self'; script-src 'self'";
    add_header Cache-Control $cache_control;

    if ($host ~ ^www\.(?<domain>.+)$) {
      return 301 https://$domain$request_uri;
    }

    if (-d $request_filename) {
      rewrite [^/]$ https://$http_host$uri/ permanent;
    }

    location = /guide/ {
      return 302 https://$http_host/guide/architecture/core/;
    }

    location = /guide/architecture/ {
      return 302 https://$http_host/guide/architecture/core/;
    }

    location = /guide/starting/ {
      return 302 https://$http_host/guide/starting/project/;
    }

    location = /guide/concepts/ {
      return 302 https://$http_host/guide/concepts/node/;
    }

    location = /recipes/ {
      return 302 https://$http_host/recipes/authentication/;
    }

    location = /protocols/ {
      return 302 https://$http_host/protocols/ws/spec/;
    }

    location = /protocols/ws/ {
      return 302 https://$http_host/protocols/ws/spec/;
    }

    # Images and fonts can’t use the policy, so we save the traffic
    location ~* \.(ico|png|woff2)$ {
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Cache-Control $cache_control;
    }
  }
}
